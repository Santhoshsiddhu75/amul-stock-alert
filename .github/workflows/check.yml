name: Amul stock check

on:
  schedule:
    # Every 5 minutes, at odd minutes (GitHub drops many runs scheduled at :00/:30).
    # GitHub still delays or skips scheduled runs, so cron-job.org also triggers this
    # workflow every 5 minutes through "workflow_dispatch" (see README).
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write # to save state.json, so a restock is only alerted once

concurrency:
  group: amul-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Playwright + Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check stock every minute for ~5 minutes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PINCODE: ${{ secrets.PINCODE }}
        run: python amul_stock_alert.py --minutes 5
      - name: Save stock state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "amul-stock-alert"
            git config user.email "amul-stock-alert@users.noreply.github.com"
            git add state.json
            git commit -m "Update stock state"
            git pull --rebase -X theirs || true
            git push
          fi
